name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Backend & Frontend Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rageval
          POSTGRES_PASSWORD: rageval_password
          POSTGRES_DB: rageval
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://rageval:rageval_password@localhost:5432/rageval
          REDIS_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "true"
        run: |
          cd backend
          python -m pytest tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-build-push:
    name: Build & Deploy to EKS
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_EKS == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/rageval-backend:${{ github.sha }} ./backend
          docker push ${{ steps.login-ecr.outputs.registry }}/rageval-backend:${{ github.sha }}

      - name: Deploy to Kubernetes Cluster
        run: |
          aws eks update-kubeconfig --name rageval-cluster --region us-east-1
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml
