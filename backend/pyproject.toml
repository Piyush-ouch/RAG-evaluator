[project]
name = "rageval-backend"
version = "0.1.0"
description = "Enterprise RAG Sandbox & Guardrail Evaluator — Backend API"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "RAG Evaluator Team"},
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # Data Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",

    # Encryption
    "cryptography>=42.0.0",

    # Background Tasks
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Object Storage
    "boto3>=1.34.0",

    # AI Providers
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    "groq>=0.8.0",

    # Vector Databases
    "pinecone-client>=4.0.0",
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",

    # Report Generation
    "weasyprint>=62.0",
    "jinja2>=3.1.0",

    # Data Processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",

    # Observability
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk[fastapi]>=2.0.0",

    # Email
    "aiosmtplib>=3.0.0",

    # Billing
    "stripe>=9.0.0",

    # Utilities
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "python-slugify>=8.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "testcontainers[postgres,redis]>=4.4.0",

    # Linting & Formatting
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # Load Testing
    "locust>=2.28.0",

    # Utilities
    "ipython>=8.24.0",
    "rich>=13.7.0",
]

prod = [
    "gunicorn>=22.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
