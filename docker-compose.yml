# =========================================================
# Enterprise RAG Sandbox & Guardrail Evaluator
# Docker Compose — Local Development
# =========================================================

services:
  # -------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rageval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rageval
      POSTGRES_PASSWORD: rageval_password
      POSTGRES_DB: rageval
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rageval"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Redis
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rageval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # MinIO (S3-compatible Object Storage)
  # -------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: rageval-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  # -------------------------------------------------------
  # MinIO Init (create default bucket)
  # -------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: rageval-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/rageval-storage --ignore-existing;
      mc anonymous set download local/rageval-storage/public;
      exit 0;
      "

  # -------------------------------------------------------
  # Backend API
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: rageval-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rageval:rageval_password@postgres:5432/rageval
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      uvicorn app.main:create_app --factory --reload
      --host 0.0.0.0 --port 8000

  # -------------------------------------------------------
  # Celery Worker
  # -------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: rageval-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rageval:rageval_password@postgres:5432/rageval
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      celery -A app.workers.celery_app worker
      -l info -Q evaluation,reports,notifications,data,scheduled,maintenance
      --concurrency=4

  # -------------------------------------------------------
  # Celery Beat (Scheduler)
  # -------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: rageval-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rageval:rageval_password@postgres:5432/rageval
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat -l info

  # -------------------------------------------------------
  # Flower (Celery Monitoring)
  # -------------------------------------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: rageval-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app flower --port=5555

  # -------------------------------------------------------
  # Frontend
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: rageval-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres-data:
  redis-data:
  minio-data:
