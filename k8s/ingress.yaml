apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rageval-ingress
  namespace: rageval
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - rageval.enterprise.com
      secretName: rageval-tls-cert
  rules:
    - host: rageval.enterprise.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rageval-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rageval-frontend-service
                port:
                  number: 3000
